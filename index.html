<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQI Pulse</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>AQI Pulse</h1>

  <label for="place">Place</label>
  <select id="place">
    <option value="34.05,-118.24">Los Angeles</option>
    <option value="39.74,-104.99">Denver</option>
    <option value="47.61,-122.33">Seattle</option>
  </select>

  <section id="map">
    <h2>Map</h2>
    <p>Fire detections will appear here.</p>
  </section>

  <section id="chart">
    <h2>Air quality</h2>
    <p>The AQI chart will appear here.</p>
    <div id="trend" class="trend" role="status" hidden></div>
    <p id="advice" class="advice" hidden></p>
    <div id="aqi-chart"></div>
    <p class="note">US AQI, hourly, last 24 hours (local time at the place). Shaded bands are the official AQI levels. Source: Open-Meteo Air Quality API. <span id="updated"></span></p>
  </section>

  <section id="summary">
    <h2>What changed</h2>
    <p>The trend explanation will appear here.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="js/trend.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
